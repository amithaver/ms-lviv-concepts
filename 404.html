<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Square Lviv — дизайн-концепти — сторінку не знайдено</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="description" content="Дизайн-концепти для погодження. Не для публікації.">
<link rel="icon" href="/ms-lviv-concepts/assets/logo/ms-lviv-red.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ms-lviv-concepts/assets/fonts.css">
<link rel="stylesheet" href="/ms-lviv-concepts/assets/base.css">
<style>
:root{--navy:#1C2B39;--red:#D50037;--stone:#EFEDE8;--line:#D6D8DA;--grey:#5F646A;--m:64px}
@media (max-width:900px){:root{--m:32px}}@media (max-width:640px){:root{--m:20px}}
body{font:400 16px/1.6 'Gotham Pro',Arial,sans-serif;color:var(--navy);background:#fff}
a{color:inherit}
.hd{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--m);height:88px;border-bottom:1px solid var(--line);--logo-h:40px}
.hd span.note{font-size:13px;color:var(--grey);text-align:right}
@media (max-width:640px){.hd{height:72px;--logo-h:30px}.hd span.note{display:none}}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:end;padding:80px 0 56px}
.intro h1{font:400 clamp(40px,5.4vw,76px)/1.02 'Vremena',Georgia,serif;margin:0}
.intro p{margin:0;max-width:560px;font-size:17px}
.flag{display:inline-block;margin-top:22px;line-height:1.35!important;background:var(--red);color:#fff;font:500 13px/1 'Gotham Pro',sans-serif;letter-spacing:.06em;padding:10px 14px}
@media (max-width:900px){.intro{grid-template-columns:1fr;gap:24px;padding:48px 0 40px}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 32px;padding:8px 0 120px}
@media (max-width:760px){.grid{grid-template-columns:1fr;gap:48px}}
.tile{display:flex;flex-direction:column;gap:12px}
.tile__img{display:block;aspect-ratio:16/10;overflow:hidden;background:var(--stone);border:1px solid var(--line)}
.tile__img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
.tile:hover .tile__img img{transform:scale(1.02)}
.tile__n{font:500 12px/1 'Gotham Pro',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:8px}
.tile h2{font:400 36px/1.1 'Vremena',Georgia,serif;margin:0}
.tile .style{margin:0;font-weight:500}
.tile .desc{margin:0;color:var(--grey);font-size:15px}
.tile .meta{margin:0;font-size:13px;color:var(--grey)}
.btn{align-self:flex-start;display:inline-flex;align-items:center;height:48px;padding:0 28px;background:var(--navy);color:#fff;text-decoration:none;font:500 15px/1 'Gotham Pro',sans-serif;margin-top:6px}
.btn:hover{background:var(--red)}
.ft{background:var(--navy);color:#fff;padding:48px var(--m);display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;font-size:14px;--logo-h:36px}
.ft p{margin:0;color:rgba(255,255,255,.72)}
.nf{padding-top:96px;padding-bottom:120px;max-width:720px;min-height:calc(100vh - 88px - 140px)}
.nf h1{font:400 clamp(40px,5vw,64px)/1.05 'Vremena',Georgia,serif;margin:0 0 20px}
</style>
</head>
<body>
<header class="hd" data-site-header><a href="/ms-lviv-concepts/" aria-label="Вітрина концептів"><span class="logo-pair" data-logo-pair><img class="logo logo-bw" src="/ms-lviv-concepts/assets/logo/bw-plus-color.svg" alt="Best Western Plus" width="176" height="80"><img class="logo logo-ms" src="/ms-lviv-concepts/assets/logo/ms-lviv-red.svg" alt="Market Square Lviv" width="238" height="80"></span></a><span class="note">Дизайн-концепти для погодження. Не для публікації.</span></header>
<main id="main">
<div class="wrap nf">
  <h1>Сторінку не знайдено</h1>
  <p>Такої адреси немає. Поверніться до вітрини концептів.</p>
  <a class="btn" href="/ms-lviv-concepts/">До вітрини</a>
</div>
<script>
(function(){var s=["lemberg-1900", "hotel-na-ploshchi", "kamianytsia-v-rozrizi", "vyd-z-terasy", "lystivky", "24-hodyny", "zhurnal-lemberg", "kliuch-vid-nomera"];var m=location.pathname.match(/\/ms-lviv-concepts\/([^\/]+)\//);
if(m&&s.indexOf(m[1])>-1&&!/\/404\.html$/.test(location.pathname)){location.replace('/ms-lviv-concepts/'+m[1]+'/404.html');}})();
</script>
</main>
<footer class="ft" data-site-footer><span class="logo-pair" data-logo-pair><img class="logo logo-bw" src="/ms-lviv-concepts/assets/logo/bw-plus-white.png" alt="Best Western Plus" width="176" height="80"><img class="logo logo-ms" src="/ms-lviv-concepts/assets/logo/ms-lviv-white.svg" alt="Market Square Lviv" width="238" height="80"></span><p>Best Western Plus Market Square Lviv · вул. Шевська, 4, Львів</p><p>Дизайн-концепти для погодження. Не для публікації.</p></footer>
</body>
</html>
